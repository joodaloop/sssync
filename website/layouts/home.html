{{ define "main" }}
<h1>SSSync, a WIP library for building offline first web apps</h1>

{{ .Content }}

<h2 style="margin-top: 2em">Docs</h2>

<div class="page-list">
  {{ range where .Site.Pages "Section" "docs" }}

  <div>
    <strong>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </strong>
    <aside>{{ .Description }}</aside>
  </div>
  {{ end }}
</div>

<h2 style="margin-top: 2em">Notes</h2>

<div class="page-list">
  {{ range .RegularPages.ByTitle }}
  <div>
    <strong>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </strong>
    <aside>{{ .Description }}</aside>
  </div>
  {{ end }}
</div>
{{ end }}
